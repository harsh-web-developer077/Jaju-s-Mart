<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaju's Mart | Orders</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="logo">🛒 JAJU'S MART — ORDERS</div><nav><a href="index.html">Store</a><a href="admin.html">Products & Pricing</a><a href="admin-orders.html">Orders</a></nav></header>
<main class="page-wrap"><section class="page-hero"><p>ORDER MANAGEMENT</p><h1>Your Orders</h1></section>
<div class="form-box" style="margin-bottom:25px"><input id="token" class="admin-input" style="width:260px" type="password" placeholder="ADMIN_TOKEN"><button class="primary-btn" style="width:auto;display:inline-block;margin-left:8px" onclick="loadOrders()">Load Orders</button></div>
<div id="orders"></div></main>
<script>
async function loadOrders(){const t=document.getElementById("token").value;localStorage.setItem("jajuAdminToken",t);const r=await fetch("/api/admin/orders",{headers:{"x-admin-token":t}});if(!r.ok){alert("Access denied.");return}const orders=await r.json();document.getElementById("orders").innerHTML=orders.length?orders.map(o=>`<div class="form-box" style="margin-bottom:18px"><h2>${o.orderId}</h2><p><strong>${o.customer.firstName} ${o.customer.lastName}</strong> • ${o.customer.phone} • ${o.customer.email}</p><p>${o.customer.address}, ${o.customer.city} - ${o.customer.pincode}</p><p>${o.items.map(i=>`${i.name} × ${i.quantity||1}`).join("<br>")}</p><p><strong>Total: ₹${Number(o.total).toLocaleString("en-IN")}</strong> • Payment: ${o.paymentStatus}</p><label>Status <select onchange="setStatus('${o.orderId}',this.value)">${["NEW","CONFIRMED","PACKED","SHIPPED","DELIVERED","CANCELLED"].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join("")}</select></label></div>`).join(""):'<div class="empty-panel"><h2>No orders yet</h2></div>'}
async function setStatus(id,status){const t=localStorage.getItem("jajuAdminToken");await fetch("/api/admin/orders/"+id+"/status",{method:"PATCH",headers:{"Content-Type":"application/json","x-admin-token":t},body:JSON.stringify({status})});loadOrders();}
document.getElementById("token").value=localStorage.getItem("jajuAdminToken")||"";
</script></body></html>
