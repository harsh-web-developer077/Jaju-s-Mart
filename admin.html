<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaju's Mart | Admin Products</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="logo">🛒 JAJU'S MART — ADMIN</div><nav><a href="index.html">Store</a><a href="products.html">Products</a><a href="admin.html">Manage Products</a><a href="admin-orders.html">Orders</a></nav></header>
<main class="page-wrap"><section class="page-hero"><p>STORE CONTROL</p><h1>Prices & Offers</h1></section>
<div class="form-box" style="margin-bottom:25px"><label><strong>Admin token</strong></label><input id="token" class="admin-input" style="width:260px" type="password" placeholder="Enter ADMIN_TOKEN"><button class="primary-btn" style="width:auto;display:inline-block;margin-left:8px" onclick="load()">Load Products</button><p class="detail-description">Set your ADMIN_TOKEN in backend/.env. Never share it publicly.</p></div>
<div class="form-box" style="overflow:auto"><table class="admin-table"><thead><tr><th>Product</th><th>Current price</th><th>New price (₹)</th><th>Offer %</th><th>Active</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
let products=[];
async function load(){const t=document.getElementById("token").value;localStorage.setItem("jajuAdminToken",t);const r=await fetch("/api/admin/products",{headers:{"x-admin-token":t}});if(!r.ok){alert("Access denied. Check your admin token.");return}products=await r.json();render();}
function render(){document.getElementById("rows").innerHTML=products.map(p=>`<tr><td><div style="display:flex;align-items:center;gap:10px"><img src="${p.image}" style="width:55px;height:55px;object-fit:cover;border-radius:8px"><strong>${p.name}</strong></div></td><td>₹${Number(p.price).toLocaleString("en-IN")}</td><td><input class="admin-input" id="price-${p.id}" type="number" value="${p.price}"></td><td><input class="admin-input" id="offer-${p.id}" type="number" min="0" max="90" value="${p.offer||0}"></td><td><input id="active-${p.id}" type="checkbox" ${p.active?'checked':''}></td><td><button class="admin-actions" onclick="save('${p.id}')">Save</button></td></tr>`).join("")}
async function save(id){const t=localStorage.getItem("jajuAdminToken"), body={price:Number(document.getElementById("price-"+id).value),offer:Number(document.getElementById("offer-"+id).value),active:document.getElementById("active-"+id).checked};const r=await fetch("/api/admin/products/"+id,{method:"PATCH",headers:{"Content-Type":"application/json","x-admin-token":t},body:JSON.stringify(body)});if(r.ok){alert("Product updated.");load()}else alert("Could not update product.");}
document.getElementById("token").value=localStorage.getItem("jajuAdminToken")||"";
</script></body></html>
